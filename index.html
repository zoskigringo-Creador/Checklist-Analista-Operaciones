<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Analista de Operaciones</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para los íconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Configuración para que se vea como app nativa al agregar a inicio -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e3a8a">

    <!-- Íconos estáticos para el escritorio del móvil -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2645/2645879.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2645/2645879.png">

    <!-- Generación de Manifest dinámico para forzar modo 'standalone' (Pantalla completa real) -->
    <script>
        const manifest = {
            "name": "Analista de Operaciones",
            "short_name": "Operaciones",
            "start_url": window.location.href.split('?')[0],
            "display": "standalone",
            "background_color": "#1e3a8a",
            "theme_color": "#1e3a8a",
            "icons": [
                {
                    "src": "https://cdn-icons-png.flaticon.com/512/2645/2645879.png",
                    "sizes": "512x512",
                    "type": "image/png",
                    "purpose": "any maskable"
                }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'});
        document.write('<link rel="manifest" href="' + URL.createObjectURL(manifestBlob) + '">');
    </script>

    <style>
        /* Animaciones y estilos personalizados */
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        .splash-screen {
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .splash-hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }

        /* Checkbox personalizado animado */
        .custom-checkbox {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.5em;
            height: 1.5em;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            display: grid;
            place-content: center;
            transition: all 0.3s ease-in-out;
            cursor: pointer;
        }

        .custom-checkbox::before {
            content: "";
            width: 0.8em;
            height: 0.8em;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
            transform: scale(0);
            background-color: white;
            transition: 0.2s transform ease-in-out;
        }

        .custom-checkbox:checked {
            background-color: #22c55e; /* Green-500 */
            border-color: #22c55e;
            transform: scale(1.1);
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        /* Animación para botones */
        .btn-active:active {
            transform: scale(0.95);
        }

        /* Scrollbar oculto para diseño más limpio */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased h-screen w-screen overflow-hidden">

    <!-- PANTALLA DE BIENVENIDA -->
    <div id="splash" class="splash-screen fixed inset-0 z-50 flex flex-col items-center justify-center bg-blue-900 text-white">
        <i class="fas fa-chart-line text-6xl mb-4 animate-bounce"></i>
        <h1 class="text-3xl font-bold tracking-wide">Analista de</h1>
        <h1 class="text-3xl font-bold tracking-wide text-blue-300">Operaciones</h1>
        <div class="mt-8 flex space-x-2">
            <div class="w-3 h-3 bg-white rounded-full animate-pulse"></div>
            <div class="w-3 h-3 bg-white rounded-full animate-pulse" style="animation-delay: 0.2s"></div>
            <div class="w-3 h-3 bg-white rounded-full animate-pulse" style="animation-delay: 0.4s"></div>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="app" class="flex flex-col h-full max-w-md mx-auto bg-slate-50 relative shadow-2xl">
        
        <!-- CABECERA -->
        <header class="bg-blue-900 text-white p-4 shadow-md z-10">
            <h2 id="header-title" class="text-xl font-bold flex items-center">
                <i class="fas fa-calendar-check mr-2"></i> Tareas de Hoy
            </h2>
            <p id="header-subtitle" class="text-blue-200 text-sm mt-1"></p>
        </header>

        <!-- ÁREA DE CONTENIDO (Scrollable) -->
        <main id="main-content" class="flex-1 overflow-y-auto p-4 pb-24 space-y-4">
            <!-- El contenido se inyecta por JS -->
        </main>

        <!-- BARRA DE NAVEGACIÓN INFERIOR -->
        <nav class="absolute bottom-0 w-full bg-white border-t border-slate-200 flex justify-around p-3 pb-6 sm:pb-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
            <button onclick="switchTab('hoy')" id="tab-hoy" class="btn-active flex flex-col items-center p-2 text-blue-600 transition-colors w-1/3">
                <i class="fas fa-list-check text-xl mb-1"></i>
                <span class="text-xs font-semibold">Hoy</span>
            </button>
            <button onclick="switchTab('historial')" id="tab-historial" class="btn-active flex flex-col items-center p-2 text-slate-400 hover:text-blue-600 transition-colors w-1/3">
                <i class="fas fa-calendar-alt text-xl mb-1"></i>
                <span class="text-xs font-semibold">Historial</span>
            </button>
            <button onclick="switchTab('configuracion')" id="tab-configuracion" class="btn-active flex flex-col items-center p-2 text-slate-400 hover:text-blue-600 transition-colors w-1/3">
                <i class="fas fa-cog text-xl mb-1"></i>
                <span class="text-xs font-semibold">Configurar</span>
            </button>
        </nav>
    </div>

    <!-- NOTIFICACIÓN TIPO TOAST INTEGRADA -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-blue-800 text-white px-4 py-2 rounded-lg shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center">
        <i id="toast-icon" class="fas fa-info-circle mr-2"></i>
        <span id="toast-msg">Mensaje</span>
    </div>

    <script>
        // --- 1. DATOS Y CONFIGURACIÓN INICIAL ---
        const TAREAS_POR_DEFECTO = [
            { id: 't1', text: 'Seguimiento diario de KPIs operativos: Efectividad de entregas (informe anulados)', type: 'default', notify: false, time: '08:00' },
            { id: 't2', text: 'Reportes diarios (ventas programadas y Pareto a Fabio para gerentes)', type: 'default', notify: false, time: '09:00' },
            { id: 't3', text: 'Actualización del status de entregas diferidas por correo a todas las áreas', type: 'default', notify: false, time: '10:00' },
            { id: 't4', text: 'Soporte a logística y trafico en decisiones operativas', type: 'default', notify: false, time: '11:00' },
            { id: 't5', text: 'Soporte ruteo en manejo QM y análisis ventas a programar (ambos ERP)', type: 'default', notify: false, time: '14:00' },
            { id: 't6', text: 'Seguimiento en tiempo real de entregas con reportes al coordinador', type: 'default', notify: false, time: '15:00' },
            { id: 't7', text: 'Implementación de modulo de control de asistencia con coordinador', type: 'default', notify: false, time: '16:00' },
            { id: 't8', text: 'Clientes no visitados por camion', type: 'default', notify: false, time: '17:00' }
        ];

        // Cargar datos de localStorage o usar defaults
        let tasks = JSON.parse(localStorage.getItem('ops_tasks')) || TAREAS_POR_DEFECTO;
        // Historial formato: { 'YYYY-MM-DD': { 't1': '08:30', 't2': '09:15' } }
        let history = JSON.parse(localStorage.getItem('ops_history')) || {};
        let notificationsSent = JSON.parse(localStorage.getItem('ops_notified')) || {};

        let currentTab = 'hoy';
        let viewDate = getTodayDateString();

        // --- 2. FUNCIONES DE UTILIDAD ---
        function getTodayDateString() {
            const today = new Date();
            // Formato YYYY-MM-DD ajustado a la zona horaria local
            return today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
        }

        function getCurrentTime() {
            const now = new Date();
            return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        }

        function formatDateDisplay(dateString) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const date = new Date(dateString + 'T00:00:00'); // Evitar problemas de zona horaria
            return date.toLocaleDateString('es-ES', options);
        }

        function saveData() {
            localStorage.setItem('ops_tasks', JSON.stringify(tasks));
            localStorage.setItem('ops_history', JSON.stringify(history));
            localStorage.setItem('ops_notified', JSON.stringify(notificationsSent));
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = msg;
            
            if(type === 'success') {
                icon.className = 'fas fa-check-circle mr-2 text-green-400';
            } else if (type === 'warning') {
                icon.className = 'fas fa-exclamation-triangle mr-2 text-amber-400';
            } else {
                icon.className = 'fas fa-info-circle mr-2 text-blue-400';
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
            }, 3000);
        }

        // --- 3. LOGICA DE VISTAS (TABS) ---
        function switchTab(tab) {
            currentTab = tab;
            
            // Actualizar UI de botones
            ['hoy', 'historial', 'configuracion'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.classList.remove('text-slate-400');
                    btn.classList.add('text-blue-600');
                } else {
                    btn.classList.remove('text-blue-600');
                    btn.classList.add('text-slate-400');
                }
            });

            renderContent();
        }

        function renderContent() {
            const main = document.getElementById('main-content');
            const title = document.getElementById('header-title');
            const subtitle = document.getElementById('header-subtitle');
            main.innerHTML = '';

            const todayStr = getTodayDateString();

            if (currentTab === 'hoy') {
                title.innerHTML = '<i class="fas fa-calendar-check mr-2"></i> Tareas de Hoy';
                subtitle.innerText = formatDateDisplay(todayStr);
                
                if (!history[todayStr]) history[todayStr] = {};

                let completedCount = 0;

                tasks.forEach(task => {
                    const isCompleted = history[todayStr].hasOwnProperty(task.id);
                    const timeCompleted = isCompleted ? history[todayStr][task.id] : null;
                    if (isCompleted) completedCount++;

                    main.appendChild(createTaskElement(task, isCompleted, timeCompleted, true, todayStr));
                });

                // Barra de progreso
                const progressDiv = document.createElement('div');
                const progressPct = tasks.length === 0 ? 0 : Math.round((completedCount / tasks.length) * 100);
                progressDiv.innerHTML = `
                    <div class="mb-4 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-sm font-medium text-slate-700">Progreso diario</span>
                            <span class="text-sm font-bold text-blue-600">${progressPct}%</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-2.5">
                            <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style="width: ${progressPct}%"></div>
                        </div>
                        <p class="text-xs text-slate-500 mt-2 text-center">${completedCount} de ${tasks.length} tareas completadas</p>
                    </div>
                `;
                main.insertBefore(progressDiv, main.firstChild);

            } else if (currentTab === 'historial') {
                title.innerHTML = '<i class="fas fa-history mr-2"></i> Historial';
                subtitle.innerText = 'Revisa días anteriores';

                main.innerHTML = `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 mb-4 sticky top-0 z-10">
                        <label class="block text-sm font-medium text-slate-700 mb-2">Seleccionar Fecha:</label>
                        <input type="date" id="history-date" value="${viewDate}" max="${todayStr}" 
                               class="w-full p-2 border border-slate-300 rounded-lg text-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>
                    <div id="history-list" class="space-y-3"></div>
                `;

                document.getElementById('history-date').addEventListener('change', (e) => {
                    viewDate = e.target.value;
                    renderHistoryList();
                });

                renderHistoryList();

            } else if (currentTab === 'configuracion') {
                title.innerHTML = '<i class="fas fa-sliders-h mr-2"></i> Configuración';
                subtitle.innerText = 'Gestiona tus tareas y alertas';

                // Añadir nueva tarea
                const addDiv = document.createElement('div');
                addDiv.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-100 mb-6';
                addDiv.innerHTML = `
                    <h3 class="font-semibold text-slate-800 mb-3"><i class="fas fa-plus-circle text-blue-500 mr-2"></i>Nueva Tarea</h3>
                    <div class="flex gap-2">
                        <input type="text" id="new-task-text" placeholder="Ej. Revisar correos gerencia..." class="flex-1 p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <button onclick="addTask()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium btn-active hover:bg-blue-700"><i class="fas fa-plus"></i></button>
                    </div>
                `;
                main.appendChild(addDiv);

                // Lista de configuración de tareas
                const listDiv = document.createElement('div');
                listDiv.className = 'space-y-4';
                
                tasks.forEach(task => {
                    const taskCard = document.createElement('div');
                    taskCard.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col gap-3';
                    taskCard.innerHTML = `
                        <div class="flex justify-between items-start">
                            <p class="text-sm font-medium text-slate-800 flex-1 pr-2">${task.text}</p>
                            ${task.type === 'custom' ? `<button onclick="deleteTask('${task.id}')" class="text-red-400 hover:text-red-600 p-1 btn-active"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                        <div class="flex items-center justify-between bg-slate-50 p-2 rounded-lg border border-slate-100">
                            <div class="flex items-center">
                                <label class="relative inline-flex items-center cursor-pointer">
                                  <input type="checkbox" class="sr-only peer" ${task.notify ? 'checked' : ''} onchange="toggleNotify('${task.id}', this.checked)">
                                  <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                                  <span class="ml-2 text-xs font-medium text-slate-600"><i class="fas fa-bell ${task.notify ? 'text-blue-500' : 'text-slate-400'} mr-1"></i>Aviso</span>
                                </label>
                            </div>
                            <input type="time" value="${task.time || '09:00'}" onchange="updateTaskTime('${task.id}', this.value)" class="p-1 border border-slate-300 rounded text-xs text-slate-700 focus:ring-1 focus:ring-blue-500 outline-none">
                        </div>
                    `;
                    listDiv.appendChild(taskCard);
                });
                main.appendChild(listDiv);

                // Botón permiso notificaciones
                const notifPermDiv = document.createElement('div');
                notifPermDiv.className = 'mt-6 text-center';
                notifPermDiv.innerHTML = `
                    <button onclick="requestNotificationPermission()" class="text-xs text-blue-600 underline">
                        Probar permisos de notificación del celular
                    </button>
                `;
                main.appendChild(notifPermDiv);
            }
        }

        function renderHistoryList() {
            const container = document.getElementById('history-list');
            container.innerHTML = '';
            
            const dayHistory = history[viewDate];

            if (!dayHistory || Object.keys(dayHistory).length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-slate-400">
                        <i class="fas fa-folder-open text-4xl mb-3 opacity-50"></i>
                        <p>No hay registros para este día.</p>
                    </div>
                `;
                return;
            }

            tasks.forEach(task => {
                const isCompleted = dayHistory.hasOwnProperty(task.id);
                if (isCompleted) {
                    const timeCompleted = dayHistory[task.id];
                    container.appendChild(createTaskElement(task, true, timeCompleted, false, viewDate));
                } else {
                    container.appendChild(createTaskElement(task, false, null, false, viewDate));
                }
            });
        }

        function createTaskElement(task, isCompleted, timeCompleted, isInteractive, dateKey) {
            const div = document.createElement('div');
            // Cambiar estilos si está completado
            const bgClass = isCompleted ? 'bg-green-50 border-green-200' : 'bg-white border-slate-200';
            const textClass = isCompleted ? 'text-slate-500 line-through' : 'text-slate-800';
            
            div.className = `p-4 rounded-xl border shadow-sm transition-all duration-300 flex items-center justify-between gap-3 ${bgClass}`;
            
            let html = `<div class="flex-1">
                            <p class="text-sm font-medium ${textClass} transition-colors duration-300">${task.text}</p>
                            ${isCompleted && timeCompleted ? `<p class="text-xs text-green-600 mt-1 font-semibold"><i class="fas fa-check-double mr-1"></i>Realizado a las ${timeCompleted}</p>` : `<p class="text-xs text-amber-500 mt-1"><i class="fas fa-clock mr-1"></i>Pendiente</p>`}
                        </div>`;

            if (isInteractive) {
                html += `<div>
                            <input type="checkbox" class="custom-checkbox btn-active" ${isCompleted ? 'checked' : ''} onclick="toggleTaskStatus('${task.id}', '${dateKey}', this.checked)">
                         </div>`;
            } else {
                // Solo mostrar icono en historial
                html += `<div>
                            ${isCompleted ? '<i class="fas fa-check-circle text-2xl text-green-500"></i>' : '<i class="fas fa-circle text-2xl text-slate-200"></i>'}
                         </div>`;
            }

            div.innerHTML = html;
            return div;
        }

        // --- 4. ACCIONES DE TAREAS ---
        function toggleTaskStatus(taskId, dateKey, isChecked) {
            if (!history[dateKey]) history[dateKey] = {};

            if (isChecked) {
                history[dateKey][taskId] = getCurrentTime();
                showToast('¡Tarea marcada como hecha!');
            } else {
                delete history[dateKey][taskId];
            }
            saveData();
            // Re-renderizar después de una pequeña pausa para ver la animación
            setTimeout(() => {
                if(currentTab === 'hoy') renderContent();
            }, 300);
        }

        function addTask() {
            const input = document.getElementById('new-task-text');
            const text = input.value.trim();
            if (text) {
                const newTask = {
                    id: 'custom_' + Date.now(),
                    text: text,
                    type: 'custom',
                    notify: false,
                    time: '09:00'
                };
                tasks.push(newTask);
                saveData();
                input.value = '';
                showToast('Nueva tarea agregada');
                renderContent();
            } else {
                showToast('Escribe algo primero', 'warning');
            }
        }

        function deleteTask(taskId) {
            if(confirm('¿Eliminar esta tarea de tu lista diaria? (No borrará el historial pasado)')) {
                tasks = tasks.filter(t => t.id !== taskId);
                saveData();
                renderContent();
            }
        }

        function toggleNotify(taskId, isChecked) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.notify = isChecked;
                saveData();
                if (isChecked) {
                    requestNotificationPermission();
                    showToast(`Aviso activado para las ${task.time}`);
                }
            }
        }

        function updateTaskTime(taskId, newTime) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.time = newTime;
                saveData();
                if(task.notify) showToast(`Hora actualizada a las ${newTime}`);
            }
        }

        // --- 5. SISTEMA DE NOTIFICACIONES ---
        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                showToast("Tu navegador no soporta notificaciones", "warning");
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(function (permission) {
                    if (permission === "granted") {
                        showToast("Notificaciones habilitadas correctamente");
                    }
                });
            }
        }

        function sendNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, {
                    body: body,
                    icon: "https://cdn-icons-png.flaticon.com/512/2645/2645879.png" // Icono genérico checklist
                });
                
                // Vibración en dispositivos móviles (Samsung A7)
                if ("vibrate" in navigator) {
                    navigator.vibrate([200, 100, 200]);
                }
            } else {
                // Fallback si no hay permisos nativos
                showToast(`🔔 ${title}: ${body}`);
                if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
            }
        }

        function checkNotifications() {
            const todayStr = getTodayDateString();
            const currentTime = getCurrentTime(); // "HH:MM"

            // Limpiar historial de notificaciones si es un nuevo día
            const lastNotifiedDay = localStorage.getItem('ops_last_notified_day');
            if(lastNotifiedDay !== todayStr) {
                notificationsSent = {};
                localStorage.setItem('ops_last_notified_day', todayStr);
                saveData();
            }

            tasks.forEach(task => {
                if (task.notify && task.time === currentTime) {
                    const notifyKey = `${todayStr}_${task.id}`;
                    // Verificar si ya fue completada hoy o si ya se envió notificación
                    const isCompleted = history[todayStr] && history[todayStr].hasOwnProperty(task.id);
                    
                    if (!isCompleted && !notificationsSent[notifyKey]) {
                        sendNotification("Recordatorio de Tarea", task.text);
                        notificationsSent[notifyKey] = true;
                        saveData();
                    }
                }
            });
            
            // Si el día cambió estando la app abierta, re-renderizar la pestaña hoy
            if(currentTab === 'hoy' && viewDate !== todayStr && new Date().getHours() === 0 && new Date().getMinutes() === 0) {
                 viewDate = todayStr;
                 renderContent();
            }
        }

        // Comprobar notificaciones cada minuto
        setInterval(checkNotifications, 60000);

        // --- 6. INICIALIZACIÓN ---
        window.onload = () => {
            // Manejar pantalla de bienvenida
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.classList.add('splash-hidden');
                setTimeout(() => splash.remove(), 800); // Remover del DOM
                
                // Renderizar contenido inicial
                renderContent();
            }, 2000);

            // Chequeo inicial de notificaciones
            checkNotifications();
        };

    </script>
</body>
</html>
