<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Analista de Operaciones</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para los íconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Configuración para que se vea como app nativa al agregar a inicio -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e3a8a">

    <!-- Íconos estáticos para el escritorio del móvil -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2645/2645879.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2645/2645879.png">

    <!-- Generación de Manifest dinámico para forzar modo 'standalone' (Pantalla completa real) -->
    <script>
        const manifest = {
            "name": "Analista de Operaciones",
            "short_name": "Operaciones",
            "start_url": window.location.href.split('?')[0],
            "display": "standalone",
            "background_color": "#1e3a8a",
            "theme_color": "#1e3a8a",
            "icons": [
                {
                    "src": "https://cdn-icons-png.flaticon.com/512/2645/2645879.png",
                    "sizes": "512x512",
                    "type": "image/png",
                    "purpose": "any maskable"
                }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'});
        document.write('<link rel="manifest" href="' + URL.createObjectURL(manifestBlob) + '">');
    </script>

    <style>
        /* Animaciones y estilos personalizados */
        * {
            /* Elimina el retraso de 300ms de los navegadores móviles al tocar */
            touch-action: manipulation;
        }

        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        .splash-screen {
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .splash-hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }

        /* Checkbox personalizado animado */
        .custom-checkbox {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.4em;
            height: 1.4em;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            display: grid;
            place-content: center;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            pointer-events: none; /* Hace que el clic pase al contenedor padre */
        }

        .custom-checkbox::before {
            content: "";
            width: 0.7em;
            height: 0.7em;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
            transform: scale(0);
            background-color: white;
            transition: 0.2s transform ease-in-out;
        }

        .custom-checkbox:checked {
            background-color: #22c55e; /* Green-500 */
            border-color: #22c55e;
            transform: scale(1.1);
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        /* Animación para botones y tarjetas */
        .btn-active:active {
            transform: scale(0.97);
        }
        
        /* Efecto presionar tarjeta entera */
        .task-card:active {
            transform: scale(0.98);
            background-color: #f8fafc;
        }

        /* Scrollbar oculto para diseño más limpio */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased h-screen w-screen overflow-hidden">

    <!-- PANTALLA DE BIENVENIDA -->
    <div id="splash" class="splash-screen fixed inset-0 z-50 flex flex-col items-center justify-center bg-blue-900 text-white">
        <i class="fas fa-chart-line text-5xl mb-4 animate-bounce"></i>
        <h1 class="text-3xl font-bold tracking-wide">Analista de</h1>
        <h1 class="text-3xl font-bold tracking-wide text-blue-300">Operaciones</h1>
        <div class="mt-8 flex space-x-2">
            <div class="w-2.5 h-2.5 bg-white rounded-full animate-pulse"></div>
            <div class="w-2.5 h-2.5 bg-white rounded-full animate-pulse" style="animation-delay: 0.2s"></div>
            <div class="w-2.5 h-2.5 bg-white rounded-full animate-pulse" style="animation-delay: 0.4s"></div>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="app" class="flex flex-col h-full max-w-md mx-auto bg-slate-50 relative shadow-2xl">
        
        <!-- CABECERA -->
        <header class="bg-blue-900 text-white p-3.5 shadow-md z-10">
            <h2 id="header-title" class="text-lg font-bold flex items-center">
                <i class="fas fa-calendar-check mr-2"></i> Tareas de Hoy
            </h2>
            <p id="header-subtitle" class="text-blue-200 text-xs mt-0.5"></p>
        </header>

        <!-- ÁREA DE CONTENIDO (Scrollable) -->
        <main id="main-content" class="flex-1 overflow-y-auto p-3 pb-24 space-y-2.5">
            <!-- El contenido se inyecta por JS -->
        </main>

        <!-- BARRA DE NAVEGACIÓN INFERIOR -->
        <nav class="absolute bottom-0 w-full bg-white border-t border-slate-200 flex justify-around p-2 pb-5 sm:pb-2 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
            <button onclick="switchTab('hoy')" id="tab-hoy" class="btn-active flex flex-col items-center p-2 text-blue-600 transition-colors w-1/3">
                <i class="fas fa-list-check text-xl mb-1"></i>
                <span class="text-[10px] font-semibold uppercase tracking-wider">Hoy</span>
            </button>
            <button onclick="switchTab('historial')" id="tab-historial" class="btn-active flex flex-col items-center p-2 text-slate-400 hover:text-blue-600 transition-colors w-1/3">
                <i class="fas fa-calendar-alt text-xl mb-1"></i>
                <span class="text-[10px] font-semibold uppercase tracking-wider">Historial</span>
            </button>
            <button onclick="switchTab('configuracion')" id="tab-configuracion" class="btn-active flex flex-col items-center p-2 text-slate-400 hover:text-blue-600 transition-colors w-1/3">
                <i class="fas fa-cog text-xl mb-1"></i>
                <span class="text-[10px] font-semibold uppercase tracking-wider">Ajustes</span>
            </button>
        </nav>
    </div>

    <!-- NOTIFICACIÓN TIPO TOAST INTEGRADA -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-full shadow-xl transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center text-sm font-medium">
        <i id="toast-icon" class="fas fa-info-circle mr-2"></i>
        <span id="toast-msg">Mensaje</span>
    </div>

    <script>
        // --- 1. DATOS Y CONFIGURACIÓN INICIAL ---
        const TAREAS_POR_DEFECTO = [
            { id: 't1', text: 'Seguimiento diario de KPIs operativos: Efectividad de entregas (informe anulados)', type: 'default', notify: false, time: '08:00' },
            { id: 't2', text: 'Reportes diarios (ventas programadas y Pareto a Fabio para gerentes)', type: 'default', notify: false, time: '09:00' },
            { id: 't3', text: 'Actualización del status de entregas diferidas por correo a todas las áreas', type: 'default', notify: false, time: '10:00' },
            { id: 't4', text: 'Soporte a logística y trafico en decisiones operativas', type: 'default', notify: false, time: '11:00' },
            { id: 't5', text: 'Soporte ruteo en manejo QM y análisis ventas a programar (ambos ERP)', type: 'default', notify: false, time: '14:00' },
            { id: 't6', text: 'Seguimiento en tiempo real de entregas con reportes al coordinador', type: 'default', notify: false, time: '15:00' },
            { id: 't7', text: 'Implementación de modulo de control de asistencia con coordinador', type: 'default', notify: false, time: '16:00' },
            { id: 't8', text: 'Clientes no visitados por camion', type: 'default', notify: false, time: '17:00' }
        ];

        let tasks = JSON.parse(localStorage.getItem('ops_tasks')) || TAREAS_POR_DEFECTO;
        let history = JSON.parse(localStorage.getItem('ops_history')) || {};
        let notificationsSent = JSON.parse(localStorage.getItem('ops_notified')) || {};

        let currentTab = 'hoy';
        let viewDate = getTodayDateString();

        // --- 2. FUNCIONES DE UTILIDAD ---
        function getTodayDateString() {
            const today = new Date();
            return today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
        }

        function getCurrentTime() {
            const now = new Date();
            return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        }

        function formatDateDisplay(dateString) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const date = new Date(dateString + 'T00:00:00'); 
            return date.toLocaleDateString('es-ES', options);
        }

        function saveData() {
            localStorage.setItem('ops_tasks', JSON.stringify(tasks));
            localStorage.setItem('ops_history', JSON.stringify(history));
            localStorage.setItem('ops_notified', JSON.stringify(notificationsSent));
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = msg;
            
            if(type === 'success') {
                icon.className = 'fas fa-check-circle mr-2 text-green-400';
            } else if (type === 'warning') {
                icon.className = 'fas fa-exclamation-triangle mr-2 text-amber-400';
            } else {
                icon.className = 'fas fa-info-circle mr-2 text-blue-400';
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4', 'scale-95');
            toast.classList.add('opacity-100', 'translate-y-0', 'scale-100');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0', 'scale-100');
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4', 'scale-95');
            }, 2500);
        }

        // --- 3. LÓGICA DE VISTAS ---
        function switchTab(tab) {
            currentTab = tab;
            ['hoy', 'historial', 'configuracion'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.classList.remove('text-slate-400');
                    btn.classList.add('text-blue-600');
                } else {
                    btn.classList.remove('text-blue-600');
                    btn.classList.add('text-slate-400');
                }
            });
            renderContent();
        }

        // Actualiza el porcentaje y contadores de la barra superior sin recargar la lista
        function updateProgressUI() {
            const todayStr = getTodayDateString();
            let completedCount = 0;
            if (history[todayStr]) {
                tasks.forEach(task => {
                    if (history[todayStr].hasOwnProperty(task.id)) completedCount++;
                });
            }
            const progressPct = tasks.length === 0 ? 0 : Math.round((completedCount / tasks.length) * 100);
            
            const pctText = document.getElementById('progress-pct');
            const bar = document.getElementById('progress-bar');
            const countText = document.getElementById('progress-count');
            
            if (pctText) pctText.innerText = `${progressPct}%`;
            if (bar) bar.style.width = `${progressPct}%`;
            if (countText) countText.innerText = `${completedCount} de ${tasks.length} tareas completadas`;
        }

        function renderContent() {
            const main = document.getElementById('main-content');
            const title = document.getElementById('header-title');
            const subtitle = document.getElementById('header-subtitle');
            main.innerHTML = '';

            const todayStr = getTodayDateString();

            if (currentTab === 'hoy') {
                title.innerHTML = '<i class="fas fa-calendar-check mr-2"></i> Tareas de Hoy';
                subtitle.innerText = formatDateDisplay(todayStr);
                
                if (!history[todayStr]) history[todayStr] = {};

                // Estructura de la barra de progreso (con IDs para actualizar rápido)
                const progressDiv = document.createElement('div');
                progressDiv.className = 'mb-2 bg-white p-3 rounded-xl shadow-sm border border-slate-100 sticky top-0 z-10';
                progressDiv.innerHTML = `
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="text-xs font-semibold text-slate-600 uppercase tracking-wide">Progreso diario</span>
                        <span id="progress-pct" class="text-sm font-bold text-blue-600">0%</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-2">
                        <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                    </div>
                    <p id="progress-count" class="text-[10px] text-slate-500 mt-1.5 text-center">0 de ${tasks.length} completadas</p>
                `;
                main.appendChild(progressDiv);

                tasks.forEach(task => {
                    const isCompleted = history[todayStr].hasOwnProperty(task.id);
                    const timeCompleted = isCompleted ? history[todayStr][task.id] : null;
                    main.appendChild(createTaskElement(task, isCompleted, timeCompleted, true, todayStr));
                });

                updateProgressUI();

            } else if (currentTab === 'historial') {
                title.innerHTML = '<i class="fas fa-history mr-2"></i> Historial';
                subtitle.innerText = 'Revisa días anteriores';

                main.innerHTML = `
                    <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-100 mb-3 sticky top-0 z-10">
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5">Seleccionar Fecha</label>
                        <input type="date" id="history-date" value="${viewDate}" max="${todayStr}" 
                               class="w-full p-2 border border-slate-200 rounded-lg text-sm text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    </div>
                    <div id="history-list" class="space-y-2.5"></div>
                `;

                document.getElementById('history-date').addEventListener('change', (e) => {
                    viewDate = e.target.value;
                    renderHistoryList();
                });

                renderHistoryList();

            } else if (currentTab === 'configuracion') {
                title.innerHTML = '<i class="fas fa-sliders-h mr-2"></i> Ajustes';
                subtitle.innerText = 'Gestiona tus tareas y alertas';

                // Añadir nueva tarea
                const addDiv = document.createElement('div');
                addDiv.className = 'bg-white p-3.5 rounded-xl shadow-sm border border-slate-100 mb-4';
                addDiv.innerHTML = `
                    <h3 class="text-xs font-semibold text-slate-600 uppercase tracking-wide mb-2"><i class="fas fa-plus-circle text-blue-500 mr-1.5"></i>Nueva Tarea</h3>
                    <div class="flex gap-2">
                        <input type="text" id="new-task-text" placeholder="Ej. Revisar correos..." class="flex-1 p-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <button onclick="addTask()" class="bg-blue-600 text-white px-3.5 py-2 rounded-lg text-sm font-medium btn-active hover:bg-blue-700"><i class="fas fa-plus"></i></button>
                    </div>
                `;
                main.appendChild(addDiv);

                // Lista de configuración
                const listDiv = document.createElement('div');
                listDiv.className = 'space-y-3';
                
                tasks.forEach(task => {
                    const taskCard = document.createElement('div');
                    taskCard.className = 'bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex flex-col gap-2.5';
                    taskCard.innerHTML = `
                        <div class="flex justify-between items-start">
                            <p class="text-[13px] font-medium text-slate-700 leading-snug flex-1 pr-2">${task.text}</p>
                            ${task.type === 'custom' ? `<button onclick="deleteTask('${task.id}')" class="text-red-400 hover:text-red-600 p-1 btn-active"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                        <div class="flex items-center justify-between bg-slate-50 p-2 rounded-lg border border-slate-100">
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" class="sr-only peer" ${task.notify ? 'checked' : ''} onchange="toggleNotify('${task.id}', this.checked)">
                                <div class="w-8 h-4 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-500"></div>
                                <span class="ml-2 text-[11px] font-medium text-slate-600"><i class="fas fa-bell ${task.notify ? 'text-blue-500' : 'text-slate-400'} mr-1"></i>Aviso</span>
                            </label>
                            <input type="time" value="${task.time || '09:00'}" onchange="updateTaskTime('${task.id}', this.value)" class="p-1 border border-slate-200 rounded text-xs text-slate-700 focus:ring-1 focus:ring-blue-500 outline-none bg-white">
                        </div>
                    `;
                    listDiv.appendChild(taskCard);
                });
                main.appendChild(listDiv);
            }
        }

        function renderHistoryList() {
            const container = document.getElementById('history-list');
            container.innerHTML = '';
            
            const dayHistory = history[viewDate];

            if (!dayHistory || Object.keys(dayHistory).length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-slate-400">
                        <i class="fas fa-folder-open text-3xl mb-2 opacity-50"></i>
                        <p class="text-sm">No hay registros para este día.</p>
                    </div>
                `;
                return;
            }

            tasks.forEach(task => {
                const isCompleted = dayHistory.hasOwnProperty(task.id);
                const timeCompleted = isCompleted ? dayHistory[task.id] : null;
                container.appendChild(createTaskElement(task, isCompleted, timeCompleted, false, viewDate));
            });
        }

        function createTaskElement(task, isCompleted, timeCompleted, isInteractive, dateKey) {
            const div = document.createElement('div');
            div.id = `task-card-${task.id}`;
            
            // Tamaños más compactos: p-3 py-2.5, gap-2.5
            const bgClass = isCompleted ? 'bg-green-50/50 border-green-200' : 'bg-white border-slate-200';
            const cursorClass = isInteractive ? 'cursor-pointer task-card' : '';
            
            div.className = `p-3 py-2.5 rounded-xl border shadow-[0_1px_2px_rgba(0,0,0,0.03)] transition-colors duration-200 flex items-center justify-between gap-2.5 ${bgClass} ${cursorClass}`;
            
            const textClass = isCompleted ? 'text-slate-400 line-through' : 'text-slate-700';
            const subTextHtml = isCompleted && timeCompleted 
                ? `<p class="text-[11px] text-green-600 mt-0.5 font-semibold"><i class="fas fa-check-double mr-1"></i>Realizado a las ${timeCompleted}</p>` 
                : `<p class="text-[11px] text-amber-500 mt-0.5"><i class="fas fa-clock mr-1"></i>Pendiente</p>`;
            
            let html = `<div class="flex-1 text-container">
                            <p class="text-[13px] font-medium leading-snug ${textClass}">${task.text}</p>
                            ${subTextHtml}
                        </div>`;

            if (isInteractive) {
                html += `<div class="shrink-0 flex items-center justify-center">
                            <input type="checkbox" id="cb-${task.id}" class="custom-checkbox" ${isCompleted ? 'checked' : ''}>
                         </div>`;
                         
                // TODA LA TARJETA ES Clickeable para mejor experiencia móvil
                div.onclick = () => {
                    const cb = document.getElementById(`cb-${task.id}`);
                    cb.checked = !cb.checked; // Invertir visualmente
                    handleTaskToggle(task.id, dateKey, cb.checked);
                };
            } else {
                html += `<div class="shrink-0">
                            ${isCompleted ? '<i class="fas fa-check-circle text-xl text-green-500"></i>' : '<i class="fas fa-circle text-xl text-slate-200"></i>'}
                         </div>`;
            }

            div.innerHTML = html;
            return div;
        }

        // --- 4. ACCIONES DE TAREAS Y ACTUALIZACIÓN DIRECTA (DOM) ---
        // Actualiza sin recargar toda la lista para evitar retrasos "toscos"
        function handleTaskToggle(taskId, dateKey, isChecked) {
            if (!history[dateKey]) history[dateKey] = {};
            const time = getCurrentTime();

            if (isChecked) {
                history[dateKey][taskId] = time;
                // Pequeña vibración nativa si está disponible al marcar
                if ("vibrate" in navigator) navigator.vibrate(50);
            } else {
                delete history[dateKey][taskId];
            }
            saveData();
            
            // Actualización visual instantánea de la tarjeta específica
            const card = document.getElementById(`task-card-${taskId}`);
            if (card) {
                const textContainer = card.querySelector('.text-container');
                const taskText = tasks.find(t => t.id === taskId).text;

                if (isChecked) {
                    card.classList.remove('bg-white', 'border-slate-200');
                    card.classList.add('bg-green-50/50', 'border-green-200');
                    textContainer.innerHTML = `
                        <p class="text-[13px] font-medium leading-snug text-slate-400 line-through">${taskText}</p>
                        <p class="text-[11px] text-green-600 mt-0.5 font-semibold"><i class="fas fa-check-double mr-1"></i>Realizado a las ${time}</p>
                    `;
                } else {
                    card.classList.remove('bg-green-50/50', 'border-green-200');
                    card.classList.add('bg-white', 'border-slate-200');
                    textContainer.innerHTML = `
                        <p class="text-[13px] font-medium leading-snug text-slate-700">${taskText}</p>
                        <p class="text-[11px] text-amber-500 mt-0.5"><i class="fas fa-clock mr-1"></i>Pendiente</p>
                    `;
                }
            }
            
            // Actualizar la barra de arriba al instante
            updateProgressUI();
        }

        function addTask() {
            const input = document.getElementById('new-task-text');
            const text = input.value.trim();
            if (text) {
                const newTask = {
                    id: 'custom_' + Date.now(),
                    text: text,
                    type: 'custom',
                    notify: false,
                    time: '09:00'
                };
                tasks.push(newTask);
                saveData();
                input.value = '';
                showToast('Nueva tarea agregada');
                renderContent();
            } else {
                showToast('Escribe algo primero', 'warning');
            }
        }

        function deleteTask(taskId) {
            if(confirm('¿Eliminar esta tarea de tu lista diaria?')) {
                tasks = tasks.filter(t => t.id !== taskId);
                saveData();
                renderContent();
            }
        }

        function toggleNotify(taskId, isChecked) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.notify = isChecked;
                saveData();
                if (isChecked) {
                    requestNotificationPermission();
                    showToast(`Aviso activado para las ${task.time}`);
                }
            }
        }

        function updateTaskTime(taskId, newTime) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.time = newTime;
                saveData();
                if(task.notify) showToast(`Hora actualizada a las ${newTime}`);
            }
        }

        // --- 5. SISTEMA DE NOTIFICACIONES ---
        function requestNotificationPermission() {
            if (!("Notification" in window)) return;
            if (Notification.permission !== "denied" && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        function sendNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, {
                    body: body,
                    icon: "https://cdn-icons-png.flaticon.com/512/2645/2645879.png"
                });
                if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
            } else {
                showToast(`🔔 Recordatorio: ${body}`);
                if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
            }
        }

        function checkNotifications() {
            const todayStr = getTodayDateString();
            const currentTime = getCurrentTime();

            const lastNotifiedDay = localStorage.getItem('ops_last_notified_day');
            if(lastNotifiedDay !== todayStr) {
                notificationsSent = {};
                localStorage.setItem('ops_last_notified_day', todayStr);
                saveData();
            }

            tasks.forEach(task => {
                if (task.notify && task.time === currentTime) {
                    const notifyKey = `${todayStr}_${task.id}`;
                    const isCompleted = history[todayStr] && history[todayStr].hasOwnProperty(task.id);
                    
                    if (!isCompleted && !notificationsSent[notifyKey]) {
                        sendNotification("Recordatorio de Tarea", task.text);
                        notificationsSent[notifyKey] = true;
                        saveData();
                    }
                }
            });
            
            if(currentTab === 'hoy' && viewDate !== todayStr && new Date().getHours() === 0 && new Date().getMinutes() === 0) {
                 viewDate = todayStr;
                 renderContent();
            }
        }

        setInterval(checkNotifications, 60000);

        // --- 6. INICIALIZACIÓN ---
        window.onload = () => {
            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.classList.add('splash-hidden');
                setTimeout(() => splash.remove(), 800); 
                renderContent();
            }, 1500); // Reducido el tiempo de splash screen a 1.5s
            checkNotifications();
        };

    </script>
</body>
</html>
